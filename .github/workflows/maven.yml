name: Build ElectricSpawners Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electricspawners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 bytecode / Paper-Purpur 1.21.11-26.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ElectricSpawners
        uses: actions/checkout@v5
        with:
          path: electricspawners
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: slimefun-legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: electricspawners/pom.xml
      - name: Publish Slimefun Legacy API to Maven Local
        working-directory: slimefun-legacy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=Legacy-SNAPSHOT -x test --no-daemon
      - name: Verify compatibility metadata
        working-directory: electricspawners
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.1</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
      - name: Verify Paper/Purpur 1.21.11 compilation
        working-directory: electricspawners
        run: mvn -B -ntp clean package
      - name: Verify Paper/Purpur 26.2 compilation
        working-directory: electricspawners
        run: mvn -B -ntp clean package -Dpaper.version=26.2.build.112-stable
      - name: Build universal release JAR from 1.21.11 baseline
        working-directory: electricspawners
        run: mvn -B -ntp clean package -Dpaper.version=1.21.11-R0.1-SNAPSHOT
      - name: Stage versioned JAR
        id: artifact
        working-directory: electricspawners
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          SOURCE="target/SF_ElectricSpawners_Legacy_v${VERSION}.jar"
          NAME="SF_ElectricSpawners${VERSION}.jar"
          test -s "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "dist/${NAME}"
          unzip -p "dist/${NAME}" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "dist/${NAME}" io.github.thebusybiscuit.electricspawners.ElectricSpawners | grep -Fq 'major version: 65'
          sha256sum "dist/${NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=${NAME}" >> "$GITHUB_OUTPUT"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: electricspawners/dist/${{ steps.artifact.outputs.jar }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        working-directory: electricspawners
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          JAR: ${{ steps.artifact.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          NOTES="Compatibility release for Minecraft/Purpur 1.21.11 through Paper/Purpur 26.2. Emits Java 21 bytecode and is compile-verified at both endpoints."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${JAR}" --clobber
          else
            gh release create "$TAG" "dist/${JAR}" --target "$GITHUB_SHA" --notes "$NOTES" --title "SF_ElectricSpawners $TAG"
          fi
