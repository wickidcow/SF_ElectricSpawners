name: Build ElectricSpawners Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electricspawners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "1.0.2"
  OUTPUT_NAME: "SF_ElectricSpawners1.0.2.jar"

jobs:
  build:
    name: Universal ElectricSpawners compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ElectricSpawners
        uses: actions/checkout@v6
        with:
          path: electricspawners
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
        with:
          repository: wickidcow/Slimefun-Legacy
          ref: master
          path: slimefun-legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: electricspawners/pom.xml
      - name: Publish Slimefun Legacy API to Maven Local
        working-directory: slimefun-legacy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=Legacy-SNAPSHOT -x test --no-daemon
      - name: Verify compatibility metadata
        working-directory: electricspawners
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.0.2</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq '<finalName>SF_ElectricSpawners${project.version}</finalName>' pom.xml
          grep -Fq "api-version: '1.21.11'" src/main/resources/plugin.yml
      - name: Verify Paper/Purpur 1.21.11 compilation
        working-directory: electricspawners
        run: mvn -B -ntp clean package
      - name: Verify Paper/Purpur 26.2 compilation
        working-directory: electricspawners
        run: mvn -B -ntp clean package "-Dpaper.version=[26.2.build,26.3)"
      - name: Verify Paper 26.3 alpha compilation
        working-directory: electricspawners
        run: mvn -B -ntp clean package -Dpaper.version=26.3-rc-3.build.1-alpha
      - name: Build universal release JAR from 1.21.11 baseline
        working-directory: electricspawners
        run: mvn -B -ntp clean package -Dpaper.version=1.21.11-R0.1-SNAPSHOT
      - name: Stage and verify versioned JAR
        working-directory: electricspawners
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="target/${OUTPUT_NAME}"
          test -s "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "dist/${OUTPUT_NAME}"
          unzip -p "dist/${OUTPUT_NAME}" plugin.yml | grep -Fq "api-version: '1.21.11'"
          javap -verbose -classpath "dist/${OUTPUT_NAME}" io.github.thebusybiscuit.electricspawners.ElectricSpawners | grep -Fq 'major version: 65'
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: electricspawners/dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        working-directory: electricspawners
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="ElectricSpawners 1.0.2 adds Paper 26.3 alpha compatibility validation while preserving the Java 21 universal release baseline and Paper/Purpur 26.2 as the primary production target. Maven now emits ${OUTPUT_NAME} directly."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --notes "$NOTES" --title "SF_ElectricSpawners $TAG"
          fi
