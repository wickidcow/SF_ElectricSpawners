# ElectricSpawners Legacy configuration
#
# Existing ElectricSpawners configs remain compatible. Historical entity names
# such as MUSHROOM_COW are translated to their modern Paper equivalents at runtime.

mob-ai:
  # Force every mob spawned by an Electric Spawner to have its AI disabled.
  # When true, players cannot enable AI from the machine menu.
  force-disable: false

  # Default AI state for newly placed Electric Spawners when force-disable is false.
  # Players can toggle this setting per spawner from the machine menu.
  default-disabled: false

# Preserve the original ElectricSpawners selection and item IDs by default.
mobs:
- BLAZE
- CAVE_SPIDER
- CHICKEN
- COW
- CREEPER
- ENDERMAN
- ENDERMITE
- GHAST
- GUARDIAN
- HORSE
- IRON_GOLEM
- MAGMA_CUBE
- MUSHROOM_COW
- OCELOT
- PIG
- RABBIT
- SHEEP
- SILVERFISH
- SKELETON
- SLIME
- SPIDER
- SQUID
- VILLAGER
- WITHER_SKELETON
- WITCH
- WOLF
- ZOMBIE
